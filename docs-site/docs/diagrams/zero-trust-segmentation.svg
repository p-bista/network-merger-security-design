<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <style>
    .title { font: 700 15px inherit; fill: #14315C; }
    .label { font: 700 13px inherit; fill: #14315C; }
    .sub { font: 400 11px inherit; fill: #44546a; }
    .zone { stroke-width: 1.5; rx: 8; }
  </style>
  <rect width="980" height="560" fill="#ffffff"/>

  <!-- Untrusted zone -->
  <rect x="20" y="20" width="220" height="110" class="zone" fill="#fdeeee" stroke="#a4262c"/>
  <text x="130" y="42" text-anchor="middle" class="label">Untrusted</text>
  <text x="130" y="62" text-anchor="middle" class="sub">Remote employee</text>
  <text x="130" y="78" text-anchor="middle" class="sub">on the open internet</text>
  <text x="130" y="100" text-anchor="middle" class="sub">No identity verified yet</text>

  <!-- Arrow to checkpoint -->
  <line x1="240" y1="75" x2="330" y2="75" stroke="#14315C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ZTNA checkpoint -->
  <rect x="335" y="20" width="230" height="110" class="zone" fill="#e7f0fd" stroke="#1a52ad"/>
  <text x="450" y="42" text-anchor="middle" class="label">Checkpoint: ZTNA Gateway</text>
  <text x="450" y="62" text-anchor="middle" class="sub">Verify identity (Duo MFA)</text>
  <text x="450" y="78" text-anchor="middle" class="sub">Check device posture</text>
  <text x="450" y="94" text-anchor="middle" class="sub">Grant access to ONE app —</text>
  <text x="450" y="108" text-anchor="middle" class="sub">never the whole network</text>

  <line x1="565" y1="75" x2="655" y2="75" stroke="#14315C" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="660" y="20" width="300" height="110" class="zone" fill="#e6f6ec" stroke="#1b7a43"/>
  <text x="810" y="42" text-anchor="middle" class="label">Trusted — but still segmented</text>
  <text x="810" y="62" text-anchor="middle" class="sub">Access limited to the one app or</text>
  <text x="810" y="78" text-anchor="middle" class="sub">service the request was scoped for.</text>
  <text x="810" y="94" text-anchor="middle" class="sub">Every other VLAN stays unreachable.</text>

  <!-- Divider -->
  <line x1="20" y1="160" x2="960" y2="160" stroke="#e3e4e6" stroke-width="1"/>
  <text x="20" y="185" class="title">Internal network — least privilege through segmentation</text>

  <!-- VLAN zones -->
  <g>
    <rect x="20" y="205" width="170" height="150" class="zone" fill="#ffffff" stroke="#14315C"/>
    <text x="105" y="228" text-anchor="middle" class="label">Servers VLAN</text>
    <text x="105" y="248" text-anchor="middle" class="sub">Exchange · SharePoint</text>
    <text x="105" y="264" text-anchor="middle" class="sub">App · File · DB</text>
    <rect x="35" y="280" width="140" height="20" fill="#fdeeee" stroke="#a4262c" stroke-width="1"/>
    <text x="105" y="294" text-anchor="middle" class="sub" font-weight="700">PCI/GLBA scope</text>
  </g>

  <g>
    <rect x="210" y="205" width="170" height="150" class="zone" fill="#ffffff" stroke="#14315C"/>
    <text x="295" y="228" text-anchor="middle" class="label">Corp Wired</text>
    <text x="295" y="248" text-anchor="middle" class="sub">192.168.4.0/22</text>
    <text x="295" y="268" text-anchor="middle" class="sub">vlan2</text>
  </g>

  <g>
    <rect x="400" y="205" width="170" height="150" class="zone" fill="#ffffff" stroke="#14315C"/>
    <text x="485" y="228" text-anchor="middle" class="label">Corp WiFi</text>
    <text x="485" y="248" text-anchor="middle" class="sub">192.168.0.0/22</text>
    <text x="485" y="268" text-anchor="middle" class="sub">vlan3</text>
  </g>

  <g>
    <rect x="590" y="205" width="170" height="150" class="zone" fill="#fdeeee" stroke="#a4262c"/>
    <text x="675" y="228" text-anchor="middle" class="label">Guest WiFi</text>
    <text x="675" y="248" text-anchor="middle" class="sub">172.16.192.0/24</text>
    <text x="675" y="264" text-anchor="middle" class="sub">vlan7</text>
    <text x="675" y="284" text-anchor="middle" class="sub" font-weight="700">Fully isolated —</text>
    <text x="675" y="298" text-anchor="middle" class="sub" font-weight="700">internet only</text>
  </g>

  <g>
    <rect x="780" y="205" width="180" height="150" class="zone" fill="#ffffff" stroke="#14315C"/>
    <text x="870" y="228" text-anchor="middle" class="label">Printers</text>
    <text x="870" y="248" text-anchor="middle" class="sub">192.168.8.0/24</text>
    <text x="870" y="268" text-anchor="middle" class="sub">vlan8</text>
  </g>

  <!-- no-lateral-movement marks between zones -->
  <g stroke="#a4262c" stroke-width="2">
    <line x1="190" y1="280" x2="210" y2="280"/>
    <line x1="380" y1="280" x2="400" y2="280"/>
    <line x1="570" y1="280" x2="590" y2="280"/>
    <line x1="760" y1="280" x2="780" y2="280"/>
  </g>
  <g fill="#a4262c" font-size="14" font-weight="700" text-anchor="middle">
    <text x="200" y="284">✕</text>
    <text x="390" y="284">✕</text>
    <text x="580" y="284">✕</text>
    <text x="770" y="284">✕</text>
  </g>
  <text x="490" y="385" text-anchor="middle" class="sub">✕ = no direct lateral traffic between VLANs by default — each zone only reaches what it needs, through the firewall pair.</text>

  <!-- Legend -->
  <rect x="20" y="420" width="940" height="120" rx="8" fill="#fafbfc" stroke="#e3e4e6"/>
  <text x="40" y="445" class="label">Legend</text>

  <rect x="40" y="460" width="18" height="18" fill="#fdeeee" stroke="#a4262c"/>
  <text x="65" y="474" class="sub">Untrusted / isolated / in regulatory scope</text>

  <rect x="40" y="488" width="18" height="18" fill="#e7f0fd" stroke="#1a52ad"/>
  <text x="65" y="502" class="sub">Identity &amp; policy checkpoint (ZTNA + MFA)</text>

  <rect x="360" y="460" width="18" height="18" fill="#e6f6ec" stroke="#1b7a43"/>
  <text x="385" y="474" class="sub">Trusted, scoped access granted</text>

  <rect x="360" y="488" width="18" height="18" fill="#ffffff" stroke="#14315C"/>
  <text x="385" y="502" class="sub">Segmented internal VLAN</text>

  <text x="650" y="474" class="sub" font-weight="700">Core idea: never trust by network location.</text>
  <text x="650" y="492" class="sub">Every request is verified, then scoped to the least access needed —</text>
  <text x="650" y="508" class="sub">whether the request comes from outside or from inside another VLAN.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#14315C"/>
    </marker>
  </defs>
</svg>
