<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <style>
    .axis { font: 700 13px inherit; fill: #14315C; }
    .cell-label { font: 400 11px inherit; fill: #1c1e21; }
    .item { font: 700 11px inherit; }
  </style>
  <rect width="700" height="560" fill="#ffffff"/>

  <text x="350" y="26" text-anchor="middle" class="axis" font-size="15">Risk / Likelihood Matrix</text>

  <!-- axis labels -->
  <text x="20" y="300" text-anchor="middle" class="axis" transform="rotate(-90 20 300)">Likelihood</text>
  <text x="380" y="545" text-anchor="middle" class="axis">Risk</text>

  <!-- grid: 3 columns (Low, Moderate, High risk) x 3 rows (Low, Moderate, High likelihood), rows bottom(Low)->top(High) -->
  <!-- columns start x=110, width=180 each -->
  <!-- rows start y=460 (Low) going up: Moderate y=300, High y=140, each height 160 -->

  <!-- column headers -->
  <text x="200" y="90" text-anchor="middle" class="axis">Low</text>
  <text x="380" y="90" text-anchor="middle" class="axis">Moderate</text>
  <text x="560" y="90" text-anchor="middle" class="axis">High</text>

  <!-- row headers -->
  <text x="90" y="225" text-anchor="end" class="axis">High</text>
  <text x="90" y="385" text-anchor="end" class="axis">Moderate</text>
  <text x="90" y="545" text-anchor="end" class="axis">Low</text>

  <!-- grid cells -->
  <g stroke="#e3e4e6" stroke-width="1">
    <!-- verticals -->
    <line x1="110" y1="100" x2="110" y2="500"/>
    <line x1="290" y1="100" x2="290" y2="500"/>
    <line x1="470" y1="100" x2="470" y2="500"/>
    <line x1="650" y1="100" x2="650" y2="500"/>
    <!-- horizontals -->
    <line x1="110" y1="100" x2="650" y2="100"/>
    <line x1="110" y1="260" x2="650" y2="260"/>
    <line x1="110" y1="380" x2="650" y2="380"/>
    <line x1="110" y1="500" x2="650" y2="500"/>
  </g>

  <!-- cell fills: color intensity increases toward high/high -->
  <rect x="110" y="100" width="180" height="160" fill="#fdeeee" opacity="0.9"/> <!-- High likelihood / Low risk -->
  <rect x="290" y="100" width="180" height="160" fill="#fdeeee" opacity="0.9"/> <!-- High / Moderate -->
  <rect x="470" y="100" width="180" height="160" fill="#f5b8b8"/> <!-- High / High -->

  <rect x="110" y="260" width="180" height="120" fill="#fff8e6"/>
  <rect x="290" y="260" width="180" height="120" fill="#ffe9b3"/> <!-- Moderate/Moderate -->
  <rect x="470" y="260" width="180" height="120" fill="#fdeeee" opacity="0.9"/>

  <rect x="110" y="380" width="180" height="120" fill="#e6f6ec"/>
  <rect x="290" y="380" width="180" height="120" fill="#fff8e6"/>
  <rect x="470" y="380" width="180" height="120" fill="#fdeeee" opacity="0.9"/>

  <!-- plotted items -->
  <!-- Company A open ports: Risk High, Likelihood High -> col High(470-650), row High(100-260) -->
  <g>
    <circle cx="560" cy="150" r="6" fill="#a4262c"/>
    <text x="500" y="180" class="item" fill="#a4262c">Co. A — open ports</text>
    <text x="500" y="194" class="item" fill="#a4262c">21–90, 3389</text>
  </g>

  <!-- Company B legacy protocols: High/High, offset lower in same cell -->
  <g>
    <circle cx="560" cy="215" r="6" fill="#a4262c"/>
    <text x="500" y="235" class="item" fill="#a4262c">Co. B — legacy</text>
    <text x="500" y="249" class="item" fill="#a4262c">remote-access protocols</text>
  </g>

  <!-- Company B no MFA: High/High -->
  <g>
    <circle cx="620" cy="150" r="6" fill="#a4262c"/>
    <text x="500" y="130" class="item" fill="#a4262c">Co. B — no MFA →</text>
  </g>

  <!-- Company A admin rights: Moderate/Moderate -->
  <g>
    <circle cx="380" cy="320" r="6" fill="#906800"/>
    <text x="310" y="345" class="item" fill="#906800">Co. A — universal</text>
    <text x="310" y="359" class="item" fill="#906800">admin rights</text>
  </g>

  <!-- Legend -->
  <rect x="110" y="515" width="18" height="18" fill="#e6f6ec"/>
  <text x="135" y="529" class="cell-label">Low</text>
  <rect x="220" y="515" width="18" height="18" fill="#ffe9b3"/>
  <text x="245" y="529" class="cell-label">Moderate</text>
  <rect x="350" y="515" width="18" height="18" fill="#f5b8b8"/>
  <text x="375" y="529" class="cell-label">High</text>
  <text x="480" y="529" class="cell-label">3 of 4 findings land in the highest-risk cell — none are theoretical.</text>
</svg>
